<!DOCTYPE html>
<html>
<head>
    <title>Worker Architecture Diagram</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #canvas {
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin: 20px 0;
        }
        .controls {
            margin-bottom: 20px;
        }
        button {
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 5px;
        }
        button:hover {
            background-color: #45a049;
        }
        h1 {
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Worker Architecture Diagram</h1>
    <div class="controls">
        <button id="downloadBtn">Download Image</button>
    </div>
    <canvas id="canvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Draw the worker architecture diagram
        function drawWorkerArchitecture() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Title
            ctx.fillStyle = '#333';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            // ctx.fillText('TrieWorkerManager Communication Architecture', canvas.width / 2, 40);
            
            const midX = canvas.width / 2;
            
            // Main Thread Box
            drawBox(midX - 170, 150, 300, 250, '#e3f2fd', 'Main Thread', '');
            
            // Worker Thread Box
            drawBox(midX + 170, 150, 300, 250, '#fff8e1', 'Worker Thread', '');
            
            // TrieWorkerManager
            drawComponent(midX - 170, 150, 220, 60, '#bbdefb', 'TrieWorkerManager', 'Handles communication with worker');
            
            // MessageChannel
            drawComponent(midX, 260, 220, 60, '#e8f5e9', 'MessageChannel', 'Bidirectional communication');
            
            // Trie Implementation
            drawComponent(midX + 170, 150, 220, 60, '#ffecb3', 'Trie Implementation', 'Actual trie data structure');
            
            // Interface components in Main Thread
            drawComponent(midX - 170, 250, 180, 50, '#c5cae9', 'API Methods', 'search, insert, autocomplete...');
            
            // Promise Handlers
            drawComponent(midX - 170, 320, 180, 50, '#d1c4e9', 'Promise Handlers', 'Resolves async operations');
            
            // Interface components in Worker Thread
            drawComponent(midX + 170, 250, 180, 50, '#ffe0b2', 'Message Handlers', 'Processes incoming commands');
            
            // Result Formatters
            drawComponent(midX + 170, 320, 180, 50, '#ffccbc', 'Result Formatters', 'Prepares responses');
            
            // Draw arrows
            // Main thread to Worker thread (request)
            drawArrow(midX - 60, 260, midX + 60, 260, 'request', false);
            
            // Worker thread to Main thread (response)
            drawArrow(midX + 60, 280, midX - 60, 280, 'response', false);
            
            // TrieWorkerManager to MessageChannel
            drawArrow(midX - 170, 180, midX - 170, 250, '', false);
            drawArrow(midX - 170, 250, midX - 170, 320, '', false);
            
            // Trie Implementation to MessageChannel
            drawArrow(midX + 170, 180, midX + 170, 250, '', false);
            drawArrow(midX + 170, 250, midX + 170, 320, '', false);
            
            // Add Legend
            const legendY = 480;
            ctx.fillStyle = '#333';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'left';
            ctx.fillText('Legend:', 50, legendY);
            
            ctx.font = '14px Arial';
            
            drawColorSquare(50, legendY + 25, '#e3f2fd');
            ctx.fillText('Main Thread Context', 70, legendY + 25);
            
            drawColorSquare(50, legendY + 50, '#fff8e1');
            ctx.fillText('Worker Thread Context', 70, legendY + 50);
            
            drawColorSquare(250, legendY + 25, '#e8f5e9');
            ctx.fillText('Communication Channel', 270, legendY + 25);
            
            // Explanation
            const explanationY = 530;
            ctx.fillStyle = '#333';
            ctx.font = '14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('The TrieWorkerManager creates and manages a Worker thread that contains the actual Trie data structure.', midX, explanationY);
            ctx.fillText('All operations are performed asynchronously via message passing, keeping the main thread responsive.', midX, explanationY + 25);
        }
        
        function drawComponent(x, y, width, height, color, title, description) {
            // Draw component box
            ctx.fillStyle = color;
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            
            // Draw rounded rectangle
            const radius = 8;
            ctx.beginPath();
            ctx.moveTo(x - width / 2 + radius, y - height / 2);
            ctx.lineTo(x + width / 2 - radius, y - height / 2);
            ctx.arcTo(x + width / 2, y - height / 2, x + width / 2, y - height / 2 + radius, radius);
            ctx.lineTo(x + width / 2, y + height / 2 - radius);
            ctx.arcTo(x + width / 2, y + height / 2, x + width / 2 - radius, y + height / 2, radius);
            ctx.lineTo(x - width / 2 + radius, y + height / 2);
            ctx.arcTo(x - width / 2, y + height / 2, x - width / 2, y + height / 2 - radius, radius);
            ctx.lineTo(x - width / 2, y - height / 2 + radius);
            ctx.arcTo(x - width / 2, y - height / 2, x - width / 2 + radius, y - height / 2, radius);
            ctx.closePath();
            
            ctx.fill();
            ctx.stroke();
            
            // Draw title
            ctx.fillStyle = '#333';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(title, x, y - height / 4);
            
            // Draw description
            ctx.font = '12px Arial';
            ctx.fillText(description, x, y + height / 6);
        }
        
        function drawBox(x, y, width, height, color, title, description) {
            // Draw outer box with title
            ctx.fillStyle = color;
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            
            // Draw rectangle with rounded corners
            const radius = 10;
            ctx.beginPath();
            ctx.moveTo(x - width / 2 + radius, y - height / 2);
            ctx.lineTo(x + width / 2 - radius, y - height / 2);
            ctx.arcTo(x + width / 2, y - height / 2, x + width / 2, y - height / 2 + radius, radius);
            ctx.lineTo(x + width / 2, y + height / 2 - radius);
            ctx.arcTo(x + width / 2, y + height / 2, x + width / 2 - radius, y + height / 2, radius);
            ctx.lineTo(x - width / 2 + radius, y + height / 2);
            ctx.arcTo(x - width / 2, y + height / 2, x - width / 2, y + height / 2 - radius, radius);
            ctx.lineTo(x - width / 2, y - height / 2 + radius);
            ctx.arcTo(x - width / 2, y - height / 2, x - width / 2 + radius, y - height / 2, radius);
            ctx.closePath();
            
            ctx.fill();
            ctx.stroke();
            
            // Add title at the top
            ctx.fillStyle = '#333';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(title, x, y - height / 2 + 25);
            
            // Add divider line
            ctx.beginPath();
            ctx.moveTo(x - width / 2, y - height / 2 + 40);
            ctx.lineTo(x + width / 2, y - height / 2 + 40);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            ctx.stroke();
        }
        
        function drawArrow(fromX, fromY, toX, toY, label, dashed = false) {
            // Calculate angle
            const angle = Math.atan2(toY - fromY, toX - fromX);
            const headLen = 10;
            
            // Draw line
            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            
            // If dashed, set the dash pattern
            if (dashed) {
                ctx.setLineDash([5, 3]);
            } else {
                ctx.setLineDash([]);
            }
            
            ctx.lineTo(toX, toY);
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.setLineDash([]); // Reset dash pattern
            
            // Draw the arrow head
            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headLen * Math.cos(angle - Math.PI / 6), toY - headLen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(toX - headLen * Math.cos(angle + Math.PI / 6), toY - headLen * Math.sin(angle + Math.PI / 6));
            ctx.closePath();
            ctx.fillStyle = '#666';
            ctx.fill();
            
            // Draw the label if provided
            if (label) {
                const midX = (fromX + toX) / 2;
                const midY = (fromY + toY) / 2 - 10;
                
                // Background for label
                const labelWidth = ctx.measureText(label).width + 10;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.fillRect(midX - labelWidth / 2, midY - 10, labelWidth, 20);
                
                ctx.fillStyle = '#333';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(label, midX, midY);
            }
        }
        
        function drawColorSquare(x, y, color) {
            ctx.fillStyle = color;
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            ctx.fillRect(x, y - 8, 15, 15);
            ctx.strokeRect(x, y - 8, 15, 15);
        }

        // Initialize
        drawWorkerArchitecture();

        // Download functionality
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'worker-architecture.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
